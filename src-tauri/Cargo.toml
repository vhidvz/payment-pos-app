[package]
name = "payment-pos-app"
version = "0.1.0"
description = "Ledger POS — a desktop bridge that exposes payment POS terminals as a local REST API"
authors = ["Vahid V. <vhid.vz@gmail.com>"]
edition = "2021"
license = "MIT"
default-run = "payment-pos-app"

[lib]
name = "payment_pos_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

des = "0.8"
cbc = "0.1"
cipher = { version = "0.4", features = ["block-padding", "alloc"] }
encoding_rs = "0.8"
chrono = "0.4"
dirs = "6"
serialport = { version = "4", default-features = false }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
argon2 = "0.6"
rpassword = "7"
libc = "0.2.189"
# Webhook events and signed receipts (src/events.rs, src/receipts.rs). `reqwest` and `sha2`
# were already in the tree through Tauri; `native-tls` uses the system's TLS (OpenSSL on Linux,
# already a build prerequisite) rather than compiling a second crypto stack.
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }

# The update engine talks to a running copy over the single-instance plugin's D-Bus name
# (src/update/system.rs); zbus is already in the tree through that plugin.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[features]
# End-to-end builds only: lets LEDGER_POS_ADMIN_PATH move the administrator file so the
# e2e harness never reads the machine's real one. Release builds never enable it.
e2e = []

[[bin]]
name = "payment-pos-app"
path = "src/main.rs"

# Headless REST-only daemon: the same core (settings, providers, HTTP API) without
# any GUI — usable from a systemd user service or a terminal session.
[[bin]]
name = "posd"
path = "src/bin/posd.rs"

[profile.release]
codegen-units = 1
lto = true
strip = true
