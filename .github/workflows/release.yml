# Release pipeline (spec §9).
#   - A v*.*.* tag: verify, build Linux (AppImage, deb, rpm) and Windows (msi), attach them
#     to a DRAFT GitHub release whose text is the CHANGELOG section. Publish it by hand.
#   - workflow_dispatch (Actions tab; only once this file is on the default branch): the same
#     verify and build, no release — the bundles are uploaded as workflow artifacts to inspect
#     before tagging.
name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Matches the `tauri` npm script (NO_STRIP=true): linuxdeploy's strip breaks on newer ELF sections.
  NO_STRIP: 'true'

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev libxdo-dev
      - run: pnpm install --frozen-lockfile
      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            node scripts/release.mjs --check-tag "$GITHUB_REF_NAME"
          else
            node scripts/release.mjs --check
          fi
      - run: node --test 'scripts/*.spec.mjs'
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: pnpm generate

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # older glibc: the AppImage runs on more distributions
            name: linux
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev libxdo-dev patchelf file
      - run: pnpm install --frozen-lockfile
      - name: Release text
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          {
            echo 'NOTES<<__RELEASE_NOTES__'
            node scripts/release.mjs --notes "${GITHUB_REF_NAME#v}"
            echo '__RELEASE_NOTES__'
          } >> "$GITHUB_ENV"
      - name: Build (attached to the draft release on a tag)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The npm `tauri` script prefixes NO_STRIP=true, which cmd.exe cannot run; call the
          # CLI directly and set NO_STRIP in env above.
          tauriScript: pnpm exec tauri
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Ledger POS {0}', github.ref_name) || '' }}
          releaseBody: ${{ env.NOTES }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
      - name: Upload bundles (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ledger-pos-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
